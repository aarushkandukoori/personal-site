<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning rate comparison</title>
  <link rel="stylesheet" href="interactive.css">
</head>
<body>
  <div class="shell">
    <section class="card">
      <div class="card-header">
        <div>
          <h2 class="card-title">Learning rate lab</h2>
          <p class="card-subtitle">Same bowl, different step sizes</p>
        </div>
        <div class="badge"><span class="badge-dot"></span>η <span id="eta-val">0.10</span></div>
      </div>

      <div class="canvas-wrap">
        <canvas id="canvas" width="760" height="320"></canvas>
      </div>

      <div class="controls">
        <div class="control">
          <div class="control-top">
            <span class="control-label">Learning rate <span class="sym">η</span></span>
            <span class="control-value" id="eta-display">0.10</span>
          </div>
          <input id="eta" type="range" min="0.01" max="0.5" step="0.01" value="0.10">
        </div>

        <div class="chip-row" id="presets">
          <button class="chip" data-eta="0.01">Slow · 0.01</button>
          <button class="chip is-active" data-eta="0.10">Balanced · 0.10</button>
          <button class="chip" data-eta="0.34">Overshoot · 0.34</button>
          <button class="chip" data-eta="0.42">Unstable · 0.42</button>
        </div>

        <div class="toolbar">
          <button class="btn btn-primary" id="run">Run descent</button>
          <button class="btn" id="reset">Reset</button>
        </div>

        <div class="status-bar">
          <p class="status-text" id="status">Every run starts from the same point. Pick a learning rate and press <strong>Run descent</strong>.</p>
          <div class="metric-row">
            <div class="metric">
              <span class="metric-label">Step</span>
              <span class="metric-value" id="step-count">0</span>
            </div>
            <div class="metric">
              <span class="metric-label"><span class="sym">w</span></span>
              <span class="metric-value" id="w-metric">-2.80</span>
            </div>
            <div class="metric">
              <span class="metric-label">Loss</span>
              <span class="metric-value" id="loss-metric">0.00</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const styles = getComputedStyle(document.documentElement);
    const colors = {
      text: () => styles.getPropertyValue("--text").trim() || "#111",
      muted: () => styles.getPropertyValue("--muted").trim() || "#666",
      grid: () => styles.getPropertyValue("--grid").trim() || "rgba(0,0,0,0.08)",
      accent: () => styles.getPropertyValue("--accent").trim() || "#000",
      canvas: () => styles.getPropertyValue("--canvas-bg").trim() || "#fff",
      border: () => styles.getPropertyValue("--border").trim() || "#ddd",
    };

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const etaInput = document.getElementById("eta");
    const etaVal = document.getElementById("eta-val");
    const etaDisplay = document.getElementById("eta-display");
    const status = document.getElementById("status");
    const stepCount = document.getElementById("step-count");
    const wMetric = document.getElementById("w-metric");
    const lossMetric = document.getElementById("loss-metric");
    const presetRow = document.getElementById("presets");

    // The bowl: loss(w) = 0.5 * CURVE * (w - OPT)^2 + 0.2.
    // Each step multiplies the distance to the minimum by (1 - eta * CURVE), so
    // eta < 0.2 slides straight down, 0.2 < eta < 0.4 overshoots and zig-zags,
    // and eta > 0.4 overshoots farther every step until the loss blows up.
    const CURVE = 5;
    const OPT = 1;
    const START_W = -2.8;
    const HALF_WIDTH = 6;
    const xMin = OPT - HALF_WIDTH;
    const xMax = OPT + HALF_WIDTH;
    const MAX_STEPS = 40;

    let w = START_W;
    let path = [w];
    let runId = 0;

    function loss(x) {
      return 0.5 * CURVE * (x - OPT) * (x - OPT) + 0.2;
    }

    function grad(x) {
      return CURVE * (x - OPT);
    }

    // Top of the chart, with a little headroom above the rim of the bowl.
    const yMax = loss(xMax) * 1.06;

    // The canvas draws at a fixed 760px and is shrunk to fit the page. This is how
    // much it is shrunk, so labels and markers can stay readable on a phone.
    function uiScale() {
      const shown = canvas.getBoundingClientRect().width;
      return shown > 0 ? Math.max(1, canvas.width / shown) : 1;
    }

    function plotter() {
      const W = canvas.width;
      const H = canvas.height;
      const pad = 42;
      return {
        W,
        H,
        pad,
        toX: (x) => pad + ((x - xMin) / (xMax - xMin)) * (W - pad * 2),
        toY: (y) => H - pad - (y / yMax) * (H - pad * 2),
      };
    }

    function draw() {
      const plot = plotter();
      const { W, H, pad, toX, toY } = plot;
      const ui = uiScale();
      const mk = Math.sqrt(ui);
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = colors.canvas();
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      const fill = ctx.createLinearGradient(0, pad, 0, H - pad);
      fill.addColorStop(0, colors.grid());
      fill.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = fill;
      ctx.beginPath();
      for (let px = pad; px <= W - pad; px++) {
        const x = xMin + ((px - pad) / (W - pad * 2)) * (xMax - xMin);
        const y = loss(x);
        if (px === pad) ctx.moveTo(px, toY(y));
        else ctx.lineTo(px, toY(y));
      }
      ctx.lineTo(W - pad, H - pad);
      ctx.lineTo(pad, H - pad);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = colors.grid();
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(toX(OPT), pad - 10);
      ctx.lineTo(toX(OPT), toY(loss(OPT)));
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = colors.accent();
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      for (let px = pad; px <= W - pad; px++) {
        const x = xMin + ((px - pad) / (W - pad * 2)) * (xMax - xMin);
        const y = loss(x);
        if (px === pad) ctx.moveTo(px, toY(y));
        else ctx.lineTo(px, toY(y));
      }
      ctx.stroke();

      const onChart = (x) => Number.isFinite(x) && loss(x) <= yMax;

      if (path.length > 1) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, H);
        ctx.clip();
        const x0 = toX(path[0]);
        const x1 = toX(path[path.length - 1]);
        let gradient = colors.accent();
        if (Number.isFinite(x1) && Math.abs(x1 - x0) > 1) {
          gradient = ctx.createLinearGradient(x0, 0, x1, 0);
          gradient.addColorStop(0, colors.muted());
          gradient.addColorStop(1, colors.accent());
        }
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2 * mk;
        ctx.setLineDash([6 * mk, 6 * mk]);
        ctx.beginPath();
        for (let i = 0; i < path.length; i++) {
          if (!Number.isFinite(path[i])) break;
          const px = toX(path[i]);
          const py = toY(loss(path[i]));
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        for (let i = 0; i < path.length; i += 1) {
          if (!onChart(path[i])) continue;
          const alpha = 0.15 + (i / path.length) * 0.75;
          ctx.fillStyle = colors.accent();
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(toX(path[i]), toY(loss(path[i])), 3 * mk, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      const minX = toX(OPT);
      const minY = toY(loss(OPT));
      ctx.fillStyle = colors.canvas();
      ctx.strokeStyle = colors.muted();
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(minX, minY, 5 * mk, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (onChart(w)) {
        const px = toX(w);
        const py = toY(loss(w));
        const glow = ctx.createRadialGradient(px, py, 0, px, py, 24 * mk);
        glow.addColorStop(0, "rgba(255,255,255,0.45)");
        glow.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(px, py, 24 * mk, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = colors.canvas();
        ctx.strokeStyle = colors.accent();
        ctx.lineWidth = 2.5 * mk;
        ctx.beginPath();
        ctx.arc(px, py, 8 * mk, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = colors.accent();
        ctx.beginPath();
        ctx.arc(px, py, 3.5 * mk, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = colors.muted();
      ctx.font = `600 ${Math.round(11 * ui)}px Inter, sans-serif`;
      ctx.textAlign = "right";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("w", W - 10, H - 10);
      // Under the minimum, where the curve never goes.
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText("minimum", minX, minY + 8 * mk);
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";

      stepCount.textContent = String(Math.max(0, path.length - 1));
      wMetric.textContent = Number.isFinite(w) ? w.toFixed(2) : "∞";
      lossMetric.textContent = Number.isFinite(w) ? loss(w).toFixed(3) : "∞";
    }

    function setEta(value) {
      etaInput.value = String(value);
      etaVal.textContent = value.toFixed(2);
      etaDisplay.textContent = value.toFixed(2);
      presetRow.querySelectorAll(".chip").forEach((chip) => {
        chip.classList.toggle("is-active", parseFloat(chip.dataset.eta) === value);
      });
    }

    function reset() {
      runId += 1;
      w = START_W;
      path = [w];
      draw();
      status.innerHTML = "<strong>Ready.</strong> Pick a learning rate and run descent.";
    }

    // Each run starts from the same point, so different learning rates are easy to compare.
    async function run() {
      const id = ++runId;
      const eta = parseFloat(etaInput.value);
      const label = eta.toFixed(2);
      w = START_W;
      path = [w];
      draw();
      status.innerHTML = `<strong>Running.</strong> Descending with η = ${label}.`;

      let crossed = false;
      for (let step = 1; step <= MAX_STEPS; step++) {
        await new Promise((r) => setTimeout(r, 110));
        if (id !== runId) return;

        const before = w - OPT;
        w = w - eta * grad(w);
        path.push(w);
        draw();

        const after = w - OPT;
        if (Math.abs(after) > 1e-3 && Math.sign(after) !== Math.sign(before)) crossed = true;

        if (!Number.isFinite(w) || loss(w) > yMax) {
          status.innerHTML = `<strong>Diverged.</strong> With η = ${label} every step overshot farther than the last, and the loss blew up off the chart.`;
          return;
        }

        if (Math.abs(after) < 1e-3) {
          const bounce = crossed ? " It overshot and bounced across the valley on the way down." : "";
          const steps = step === 1 ? "1 step" : `${step} steps`;
          status.innerHTML = `<strong>Converged.</strong> Reached the minimum in ${steps} with η = ${label}.${bounce}`;
          return;
        }
      }

      status.innerHTML = crossed
        ? `<strong>Still bouncing.</strong> η = ${label} keeps jumping across the valley and did not settle within ${MAX_STEPS} steps.`
        : `<strong>Still moving.</strong> η = ${label} did not settle within ${MAX_STEPS} steps.`;
    }

    etaInput.addEventListener("input", () => {
      const value = parseFloat(etaInput.value);
      setEta(value);
    });

    presetRow.addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      setEta(parseFloat(chip.dataset.eta));
    });

    document.getElementById("run").addEventListener("click", run);
    document.getElementById("reset").addEventListener("click", reset);
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
    window.addEventListener("resize", draw);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    draw();

    function reportHeight() {
      const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "chirpy-interactive-height", height }, "*");
      }
    }

    reportHeight();
    window.addEventListener("load", reportHeight);
    window.addEventListener("resize", reportHeight);
    if (window.ResizeObserver) {
      new ResizeObserver(reportHeight).observe(document.documentElement);
    }
  </script>
</body>
</html>
