<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where do you set the &quot;I have arrived&quot; threshold?</title>
  <link rel="stylesheet" href="../../gradient-descent/interactive.css">
</head>
<body>
  <div class="shell">
    <section class="card">
      <div class="card-header">
        <div>
          <h2 class="card-title">Where do you set the &quot;I have arrived&quot; threshold?</h2>
          <p class="card-subtitle">Slide the confidence cutoff an agent needs before it declares a subgoal done.</p>
        </div>
      </div>
      
      <div class="controls" style="padding-top:1rem">
        <div class="control">
          <div class="control-top"><span class="control-label">Threshold</span><span class="control-value" id="th">0.50</span></div>
          <input id="t" type="range" min="0.05" max="0.95" step="0.01" value="0.5">
        </div>
        <div class="metric-row" style="margin-top:0.9rem">
          <div class="metric"><span class="metric-label">precision</span><span class="metric-value" id="pr">-</span></div>
          <div class="metric"><span class="metric-label">recall</span><span class="metric-value" id="rc">-</span></div>
          <div class="metric"><span class="metric-label">F1</span><span class="metric-value" id="f1">-</span></div>
        </div>
        <p class="hint">Raise the threshold: fewer false positives, more missed positives. There is no free lunch.</p>
      </div>
    
    </section>
  </div>
  <script>

    // Same precision and recall curves as the figure in the post, read at
    // thresholds 0.05, 0.10, ..., 0.95 and linearly interpolated in between
    const T0 = 0.05, STEP = 0.05;
    const PREC = [0.514, 0.521, 0.538, 0.559, 0.576, 0.615, 0.659, 0.710, 0.766, 0.820, 0.867, 0.897, 0.929, 0.952, 0.970, 0.989, 0.995, 1.000, 1.000];
    const REC = [1.000, 1.000, 1.000, 1.000, 0.996, 0.991, 0.984, 0.964, 0.935, 0.881, 0.829, 0.744, 0.655, 0.549, 0.451, 0.334, 0.233, 0.161, 0.100];
    function curveAt(values, t) {
      const x = Math.max(0, Math.min(values.length - 1, Math.round(((t - T0) / STEP) * 1e9) / 1e9));
      const i = Math.min(values.length - 2, Math.floor(x));
      return values[i] + (values[i + 1] - values[i]) * (x - i);
    }
    function metrics(t) {
      const precision = curveAt(PREC, t);
      const recall = curveAt(REC, t);
      const f1 = (2*precision*recall) / Math.max(precision+recall, 1e-9);
      return {precision, recall, f1};
    }
    const input = document.getElementById("t");
    function update() {
      const t = parseFloat(input.value);
      const m = metrics(t);
      document.getElementById("th").textContent = t.toFixed(2);
      document.getElementById("pr").textContent = m.precision.toFixed(3);
      document.getElementById("rc").textContent = m.recall.toFixed(3);
      document.getElementById("f1").textContent = m.f1.toFixed(3);
      reportHeight();
    }
    input.addEventListener("input", update);
    update();
    

    function reportHeight() {
      const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "chirpy-interactive-height", height }, "*");
      }
    }
    reportHeight();
    window.addEventListener("load", reportHeight);
    window.addEventListener("resize", reportHeight);
    if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.documentElement);

  </script>
</body>
</html>
