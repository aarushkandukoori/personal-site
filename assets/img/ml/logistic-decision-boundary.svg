      <stop offset="0" stop-color="#c2c2c2"/>
      <stop offset="0.38" stop-color="#d3d3d3"/>
      <stop offset="0.5" stop-color="#e2e2e2"/>
      <stop offset="0.62" stop-color="#f1f1f1"/>
      <stop offset="1" stop-color="#fbfbfb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" fill="#f4f4f4"/>
  <rect x="60" y="40" width="600" height="260" fill="url(#pshade)"/>
  <g stroke="#000" stroke-opacity="0.07" stroke-width="1">
