  <circle cx="245" cy="85" r="9" fill="#111"/>
  <circle cx="115" cy="215" r="9" fill="#111"/>
  <circle cx="300" cy="150" r="9" fill="#111"/>
  <circle cx="165" cy="245" r="9" fill="#111"/>
  <circle cx="430" cy="255" r="9" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
  <circle cx="505" cy="205" r="9" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
  <circle cx="575" cy="240" r="9" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
  <circle cx="612" cy="165" r="9" fill="#ffffff" stroke="#111" stroke-width="2.5"/>
