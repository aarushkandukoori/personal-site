  <line x1="150" y1="300" x2="560" y2="40" stroke="#111" stroke-width="3"/>
  <text transform="translate(429.0 105.3) rotate(-32.38)" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#111">w<tspan dy="5" font-size="11">1</tspan><tspan dy="-5">x</tspan><tspan dy="5" font-size="11">1</tspan><tspan dy="-5"> + w</tspan><tspan dy="5" font-size="11">2</tspan><tspan dy="-5">x</tspan><tspan dy="5" font-size="11">2</tspan><tspan dy="-5"> + b = 0</tspan></text>
