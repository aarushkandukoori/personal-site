<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bg { fill: #f8f5fc; }
    .surface { fill: #ffffff; stroke: #1c1328; stroke-opacity: .1; }
    .title { fill: #1c1328; font-size: 21px; font-weight: 700; }
    .h { fill: #1c1328; font-size: 16px; font-weight: 700; }
    .verdict { fill: #1c1328; font-size: 14px; font-weight: 600; }
    .m { fill: #6f6380; font-size: 13px; }
    .s { fill: #6f6380; font-size: 12px; }
    .a { fill: #7048e8; }
    .b { fill: #e64980; }
    .c { fill: #1098ad; }
    .ta { fill: #7048e8; font-size: 12px; font-weight: 600; }
    .tb { fill: #e64980; font-size: 12px; font-weight: 600; }
    .tc { fill: #1098ad; font-size: 12px; font-weight: 600; }
    .la { stroke: #7048e8; stroke-width: 2; }
    .lb { stroke: #e64980; stroke-width: 2; }
    .lc { stroke: #1098ad; stroke-width: 2; }
    .rule { stroke: #1c1328; stroke-opacity: .1; }
    .thumbA { fill: #7048e8; fill-opacity: .13; stroke: #7048e8; stroke-opacity: .45; }
    .thumbC { fill: #1098ad; fill-opacity: .13; stroke: #1098ad; stroke-opacity: .45; }
    .ghost { fill: none; stroke: #6f6380; stroke-width: 1.5; stroke-dasharray: 3 4; }
    .wave { fill: none; stroke: #e64980; stroke-width: 3; stroke-linecap: round; }
    .noise { fill: #f8f5fc; }
    .arrowM { fill: #6f6380; }
    .lineM { stroke: #6f6380; stroke-width: 2; stroke-dasharray: 6 6; }
    .lineA { stroke: #7048e8; stroke-width: 2; stroke-dasharray: 6 6; }
    .ringM { fill: none; stroke: #6f6380; stroke-width: 1.5; }
    .ringA { fill: none; stroke: #7048e8; stroke-width: 2; }
    .flow { animation: flow 1.1s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse { animation: none; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #130f1b; }
      .surface { fill: #1b1526; stroke: #f1ecf8; stroke-opacity: .12; }
      .title, .h, .verdict { fill: #f1ecf8; }
      .m, .s { fill: #a297b3; }
      .a { fill: #9775fa; }
      .b { fill: #f783ac; }
      .c { fill: #3bc9db; }
      .ta { fill: #9775fa; }
      .tb { fill: #f783ac; }
      .tc { fill: #3bc9db; }
      .la { stroke: #9775fa; }
      .lb { stroke: #f783ac; }
      .lc { stroke: #3bc9db; }
      .rule { stroke: #f1ecf8; stroke-opacity: .12; }
      .thumbA { fill: #9775fa; stroke: #9775fa; }
      .thumbC { fill: #3bc9db; stroke: #3bc9db; }
      .ghost { stroke: #a297b3; }
      .wave { stroke: #f783ac; }
      .noise { fill: #130f1b; }
      .arrowM { fill: #a297b3; }
      .lineM { stroke: #a297b3; }
      .lineA { stroke: #9775fa; }
      .ringM { stroke: #a297b3; }
      .ringA { stroke: #9775fa; }
    }
  </style>
  <defs>
    <rect id="chip" width="16" height="34" rx="4"/>
    <g id="scene">
      <circle class="b" cx="140" cy="262" r="12"/>
      <polygon class="a" points="52,328 92,272 122,306 140,286 166,328"/>
    </g>
    <pattern id="lossy" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect class="noise" width="5" height="5"/>
      <rect class="noise" x="5" y="5" width="5" height="5"/>
    </pattern>
  </defs>

  <rect class="bg" width="900" height="464" rx="16"/>
  <text class="title" x="28" y="38">One attention row, one fixed budget</text>
  <text class="m" x="28" y="60">A target token's attention always sums to the same total. Schematic, illustrative proportions, not measured values.</text>

  <!-- Left panel -->
  <rect class="surface" x="24" y="76" width="417" height="348" rx="12"/>
  <text class="h" x="44" y="103">Older defenses</text>
  <text class="m" x="44" y="123">Push attention away from the reference</text>

  <line class="lineM flow" x1="72" y1="142" x2="330" y2="142"/>
  <polygon class="arrowM" points="340,142 329,136 329,148"/>

  <g class="a">
    <use href="#chip" x="44" y="156"/><use href="#chip" x="63" y="156"/><use href="#chip" x="82" y="156"/><use href="#chip" x="101" y="156"/>
  </g>
  <g class="c">
    <use href="#chip" x="120" y="156"/><use href="#chip" x="139" y="156"/><use href="#chip" x="158" y="156"/><use href="#chip" x="177" y="156"/><use href="#chip" x="196" y="156"/><use href="#chip" x="215" y="156"/><use href="#chip" x="234" y="156"/>
  </g>
  <g class="b">
    <use href="#chip" x="253" y="156"/><use href="#chip" x="272" y="156"/><use href="#chip" x="291" y="156"/><use href="#chip" x="310" y="156"/><use href="#chip" x="329" y="156"/><use href="#chip" x="348" y="156"/><use href="#chip" x="367" y="156"/><use href="#chip" x="386" y="156"/><use href="#chip" x="405" y="156"/>
  </g>
  <rect class="ringM pulse" x="116" y="152" width="309" height="42" rx="7"/>
  <line class="la" x1="44" y1="198" x2="117" y2="198"/>
  <line class="lc" x1="120" y1="198" x2="250" y2="198"/>
  <line class="lb" x1="253" y1="198" x2="421" y2="198"/>
  <text class="ta" x="44" y="214">reference</text>
  <text class="tc" x="120" y="214">text</text>
  <text class="tb" x="253" y="214">canvas</text>

  <line class="rule" x1="44" y1="226" x2="421" y2="226"/>

  <rect class="thumbA" x="44" y="238" width="130" height="100" rx="8"/>
  <use href="#scene"/>
  <text class="s" x="232" y="279" text-anchor="middle">edit request</text>
  <line class="lineM flow" x1="186" y1="290" x2="272" y2="290"/>
  <polygon class="arrowM" points="282,290 271,284 271,296"/>
  <rect class="thumbC" x="291" y="238" width="130" height="100" rx="8"/>
  <polyline class="ghost" points="299,328 339,272 369,306 387,286 413,328"/>
  <circle class="c" cx="322" cy="264" r="13"/>
  <path class="wave" d="M303 306 q14 -18 28 0 t28 0 t28 0 t22 -4"/>
  <text class="s" x="109" y="355" text-anchor="middle">protected image</text>
  <text class="s" x="356" y="355" text-anchor="middle">new, weakly grounded</text>
  <text class="verdict" x="232" y="384" text-anchor="middle">Model can still follow the instruction</text>
  <text class="s" x="232" y="404" text-anchor="middle">Text and its own generated tokens take up the slack</text>

  <!-- Right panel -->
  <rect class="surface" x="459" y="76" width="417" height="348" rx="12"/>
  <text class="h" x="479" y="103">Copying-as-Defense</text>
  <text class="m" x="479" y="123">Pulls attention onto the reference</text>

  <line class="lineA flow" x1="846" y1="142" x2="572" y2="142"/>
  <polygon class="a" points="562,142 573,136 573,148"/>

  <g class="a">
    <use href="#chip" x="479" y="156"/><use href="#chip" x="498" y="156"/><use href="#chip" x="517" y="156"/><use href="#chip" x="536" y="156"/><use href="#chip" x="555" y="156"/><use href="#chip" x="574" y="156"/><use href="#chip" x="593" y="156"/><use href="#chip" x="612" y="156"/><use href="#chip" x="631" y="156"/><use href="#chip" x="650" y="156"/><use href="#chip" x="669" y="156"/><use href="#chip" x="688" y="156"/><use href="#chip" x="707" y="156"/><use href="#chip" x="726" y="156"/><use href="#chip" x="745" y="156"/>
  </g>
  <g class="c">
    <use href="#chip" x="764" y="156"/><use href="#chip" x="783" y="156"/>
  </g>
  <g class="b">
    <use href="#chip" x="802" y="156"/><use href="#chip" x="821" y="156"/><use href="#chip" x="840" y="156"/>
  </g>
  <rect class="ringA pulse" x="475" y="152" width="290" height="42" rx="7"/>
  <line class="la" x1="479" y1="198" x2="761" y2="198"/>
  <line class="lc" x1="764" y1="198" x2="799" y2="198"/>
  <line class="lb" x1="802" y1="198" x2="856" y2="198"/>
  <text class="ta" x="479" y="214">reference</text>
  <text class="tc" x="764" y="214">text</text>
  <text class="tb" x="802" y="214">canvas</text>

  <line class="rule" x1="479" y1="226" x2="856" y2="226"/>

  <rect class="thumbA" x="479" y="238" width="130" height="100" rx="8"/>
  <use href="#scene" x="435"/>
  <text class="s" x="667" y="279" text-anchor="middle">edit request</text>
  <line class="lineA flow" x1="621" y1="290" x2="707" y2="290"/>
  <polygon class="a" points="717,290 706,284 706,296"/>
  <rect class="thumbA" x="726" y="238" width="130" height="100" rx="8"/>
  <use href="#scene" x="682"/>
  <rect x="726" y="238" width="130" height="100" rx="8" fill="url(#lossy)" opacity=".38"/>
  <text class="s" x="544" y="355" text-anchor="middle">protected image</text>
  <text class="s" x="791" y="355" text-anchor="middle">often a lossy copy</text>
  <text class="verdict" x="667" y="384" text-anchor="middle">Editing collapses, model reproduces its input</text>
  <text class="s" x="667" y="404" text-anchor="middle">Applied in only a few early blocks</text>

  <text class="s" x="28" y="447">Schematic of the idea in Copying As Defense (arXiv 2610.35566). Each chip is a share of one row, not a measurement.</text>
</svg>