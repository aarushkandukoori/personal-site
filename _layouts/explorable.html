<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | {{ site.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="author" content="{{ site.social.name }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.image.path | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="{{ page.image.path | absolute_url }}">
<link rel="icon" href="/assets/img/favicons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/img/favicons/favicon-96x96.png" sizes="96x96" type="image/png">
<link rel="preload" href="../../assets/posts/{{ page.asset_dir }}/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../assets/posts/{{ page.asset_dir }}/post.css">
<script src="../../assets/posts/{{ page.asset_dir }}/js/theme.js"></script>
</head>
<body>
{{ content }}
<script type="module" src="../../assets/posts/{{ page.asset_dir }}/js/main.js"></script>
</body>
</html>
