<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eaf4ea">
<meta name="robots" content="noindex,nofollow">
<title>Status</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Ccircle%20cx='8'%20cy='8'%20r='6.5'%20fill='%230ca30c'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   AARUSH AUTOMATION STATUS — the "a baby can read it" board.
   One giant verdict, six plain cards, one quiet strip. Nothing else.
   Status colors validated (dataviz validator, all checks PASS, both modes):
     light on card #ffffff : good #0ca30c · working #2a78d6 · warn #c98500 · bad #d03b3b
     dark  on card #232623 : good #0ca30c · working #3987e5 · warn #bd8600 · bad #d03b3b
   Status is never color-alone — every chip and the verdict carry symbol + word.
   ========================================================================== */
:root{
  --ok:#0ca30c; --work:#2a78d6; --warn:#c98500; --bad:#d03b3b; --wait:#68716b;
  --card:#ffffff;
  --ink:#1b221c; --ink2:#57615a;
  --iconbg:#f0f2ef;
  --tint-ok:#eaf4ea; --tint-degraded:#f7f0df; --tint-down:#f9ecec; --tint-none:#eff1ef;
  --shadow:0 8px 28px rgba(20,40,25,.08), 0 2px 6px rgba(20,40,25,.05);
  --veilbg:rgba(240,243,240,.97);
}
@media (prefers-color-scheme: dark){
  :root{
    --work:#3987e5; --warn:#bd8600; --wait:#7b857e;
    --card:#232623;
    --ink:#eef1ee; --ink2:#a7afa8;
    --iconbg:#2d312d;
    --tint-ok:#121a12; --tint-degraded:#1c1710; --tint-down:#1f1214; --tint-none:#161816;
    --shadow:0 8px 28px rgba(0,0,0,.35);
    --veilbg:rgba(18,20,18,.97);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  position:fixed;inset:0;width:100dvw;height:100dvh;overflow:hidden;
  overscroll-behavior:none;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--tint-none);
  transition:background-color 1.2s ease;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
body{--glow:var(--wait)}
body[data-overall="ok"]{background:var(--tint-ok);--glow:var(--ok)}
body[data-overall="degraded"]{background:var(--tint-degraded);--glow:var(--warn)}
body[data-overall="down"]{background:var(--tint-down);--glow:var(--bad)}

/* ---------------- ambient life: two huge glow blobs drifting very slowly -- */
#bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#bg i{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle closest-side, var(--glow), transparent 72%);
  will-change:transform;
}
#blob1{width:78vmax;height:78vmax;left:-26vmax;top:-32vmax;opacity:.11;animation:drift1 90s ease-in-out infinite alternate}
#blob2{width:64vmax;height:64vmax;right:-22vmax;bottom:-28vmax;opacity:.08;animation:drift2 120s ease-in-out infinite alternate}
@media (prefers-color-scheme: dark){
  #blob1{opacity:.15}
  #blob2{opacity:.11}
}
@keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(9vmax,6vmax,0) scale(1.14)}}
@keyframes drift2{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-8vmax,-7vmax,0) scale(1)}}

#app{
  position:absolute;inset:0;
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
  gap:clamp(9px,1.6vmin,20px);
  padding:calc(clamp(12px,2vmin,26px) + env(safe-area-inset-top))
          calc(clamp(14px,2.4vmin,30px) + env(safe-area-inset-right))
          calc(clamp(10px,1.6vmin,20px) + env(safe-area-inset-bottom))
          calc(clamp(14px,2.4vmin,30px) + env(safe-area-inset-left));
}

/* ---------------- the one giant verdict ---------------- */
#verdict{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(14px,2.6vmin,30px);min-width:0;
}
#vcircle{
  flex:none;position:relative;
  width:clamp(68px,11.5vmin,124px);height:clamp(68px,11.5vmin,124px);
  border-radius:50%;
  display:grid;place-items:center;
  background:var(--wait);
  color:#fff;font-size:clamp(38px,6.6vmin,72px);font-weight:900;line-height:1;
  box-shadow:var(--shadow);
  transition:background-color .8s ease;
  animation:breathe 3s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
/* soft ripple ping expanding from behind the verdict circle every 4s */
#vcircle::before{
  content:"";position:absolute;inset:0;border-radius:50%;z-index:-1;
  background:inherit;opacity:0;pointer-events:none;
  animation:ripple 4s ease-out infinite;
}
@keyframes ripple{
  0%{opacity:.32;transform:scale(1)}
  70%{opacity:0;transform:scale(2.05)}
  100%{opacity:0;transform:scale(2.05)}
}

/* ---------------- "why this status" popup ---------------- */
#verdict.click{cursor:pointer;-webkit-tap-highlight-color:transparent}
#verdict.click:active #vcircle{transform:scale(.95)}
#why{
  position:absolute;inset:0;z-index:70;display:none;place-items:center;
  background:rgba(8,12,8,.45);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding:calc(clamp(10px,2vmin,26px) + env(safe-area-inset-top))
          calc(clamp(10px,2vmin,26px) + env(safe-area-inset-right))
          calc(clamp(10px,2vmin,26px) + env(safe-area-inset-bottom))
          calc(clamp(10px,2vmin,26px) + env(safe-area-inset-left));
}
#why.show{display:grid}
#whybox{
  width:min(100%,640px);max-height:100%;
  background:var(--card);border-radius:24px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  animation:mpop .28s ease;
}
#whyhead{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;flex:none}
#whytitle{
  flex:1;min-width:0;
  font-size:clamp(18px,2.9vmin,26px);font-weight:800;letter-spacing:-.01em;line-height:1.1;
}
#whyclose{
  flex:none;width:38px;height:38px;border-radius:50%;border:none;
  background:var(--iconbg);color:var(--ink);font-size:18px;font-weight:900;cursor:pointer;
}
#whylist{
  min-height:0;overflow-y:auto;padding:2px 18px 16px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  -webkit-user-select:text;user-select:text;
}
.whyitem{
  background:var(--iconbg);border-radius:16px;padding:12px 14px;margin-top:10px;
}
.whyitem .whotop{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(14px,2.3vmin,18px)}
.whyitem .whotop svg{width:clamp(20px,3vmin,26px);height:clamp(20px,3vmin,26px);flex:none}
.whyitem .whotop .wbadge{
  margin-left:auto;flex:none;background:var(--bad);color:#fff;border-radius:999px;
  padding:.25em .75em;font-size:clamp(11px,1.8vmin,14px);font-weight:800;
}
.whyitem ul{list-style:none;margin:8px 0 0}
.whyitem li{
  position:relative;padding:4px 0 4px 18px;
  font-weight:600;font-size:clamp(13px,2.05vmin,16px);line-height:1.45;overflow-wrap:anywhere;
}
.whyitem li::before{content:"•";position:absolute;left:4px;color:var(--ink2)}
.whyok{
  text-align:center;padding:22px 8px 12px;font-weight:700;
  font-size:clamp(14px,2.3vmin,18px);color:var(--ink2);line-height:1.5;
}
.whyok .bigok{font-size:clamp(34px,6vmin,54px);display:block;margin-bottom:8px}

/* ---------------- live heartbeat line (EKG) ---------------- */
#ekgwrap{height:clamp(30px,4.6vmin,56px);min-width:0;position:relative}
#ekg{position:absolute;inset:0;width:100%;height:100%;display:block}
#vcircle span{transform:translateY(-2%)}
#vwords{
  min-width:0;
  font-size:clamp(26px,5.3vmin,58px);
  font-weight:800;letter-spacing:-.01em;line-height:1.02;
}

/* ---------------- fourteen big cards ---------------- */
#cards{
  display:grid;min-height:0;min-width:0;
  grid-template-columns:repeat(5,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));
  gap:clamp(10px,1.8vmin,22px);
}
@media (orientation: portrait){
  #cards{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr))}
}
.card{
  position:relative;
  min-height:0;min-width:0;overflow:hidden;
  background:var(--card);border-radius:24px;box-shadow:var(--shadow);
  padding:clamp(12px,2.2vmin,26px);
  display:flex;flex-direction:column;justify-content:space-between;
  gap:clamp(6px,1.1vmin,14px);
}
/* small glowing status dot per card, phase-offset pulse so the grid shimmers */
.livedot{
  position:absolute;
  top:clamp(12px,2.2vmin,24px);right:clamp(12px,2.2vmin,24px);
  width:clamp(7px,1.15vmin,11px);height:clamp(7px,1.15vmin,11px);
  border-radius:50%;pointer-events:none;
  background:var(--dotc,var(--wait));
  box-shadow:0 0 clamp(6px,1vmin,10px) clamp(1px,.2vmin,2px) var(--dotc,var(--wait));
  animation:dotpulse 2.8s ease-in-out infinite;
}
@keyframes dotpulse{0%,100%{opacity:.35}50%{opacity:.95}}
.card.pop{animation:pop .55s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
.top{display:flex;align-items:center;gap:clamp(8px,1.5vmin,16px);min-width:0}
.iconbox{
  flex:none;width:clamp(38px,6.2vmin,62px);height:clamp(38px,6.2vmin,62px);
  border-radius:clamp(10px,1.8vmin,18px);
  background:var(--iconbg);display:grid;place-items:center;color:var(--ink);
}
.iconbox svg{width:72%;height:72%}
.name{
  min-width:0;font-size:clamp(17px,2.75vmin,29px);font-weight:800;
  letter-spacing:-.01em;line-height:1.05;
  overflow:hidden;text-overflow:ellipsis;
}
.chip{
  align-self:flex-start;max-width:100%;
  display:inline-flex;align-items:center;gap:.45em;
  font-size:clamp(15px,2.45vmin,24px);font-weight:800;color:#fff;
  padding:.42em .85em;border-radius:999px;
  background:var(--wait);
  transition:background-color .6s ease;
  white-space:nowrap;
}
.chip .sym{font-weight:900}
.c-ok{background:var(--ok)}
.c-work{background:var(--work)}
.c-wait{background:var(--wait)}
.c-bad{background:var(--bad)}
.spin{
  width:.85em;height:.85em;flex:none;border-radius:50%;
  border:.16em solid rgba(255,255,255,.4);border-top-color:#fff;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.say{
  font-size:clamp(13px,2.05vmin,20px);font-weight:600;color:var(--ink2);
  line-height:1.3;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ---------------- quiet bottom strip ---------------- */
#strip{
  display:flex;align-items:center;gap:clamp(12px,2.4vmin,32px);
  font-size:clamp(12px,1.8vmin,17px);font-weight:600;color:var(--ink2);
  min-width:0;white-space:nowrap;
}
#doctor{flex:none}
#blogline{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center}
#updated{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:.5em}
/* refresh blip: tiny dot that radar-pings once when a poll succeeds */
#upddot{
  position:relative;flex:none;
  width:.55em;height:.55em;border-radius:50%;
  background:var(--glow);
}
#updping{
  position:absolute;inset:0;border-radius:50%;
  background:var(--glow);opacity:0;pointer-events:none;
}
#updping.go{animation:blip .9s ease-out}
@keyframes blip{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}

/* ---------------- offline veil ---------------- */
#veil{
  position:absolute;inset:0;z-index:40;
  background:var(--veilbg);
  display:grid;place-items:center;text-align:center;
  padding:6vmin;
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
#veil.show{opacity:1;pointer-events:auto}
#veil .zzz{font-size:clamp(54px,12vmin,120px);line-height:1}
#veil h2{font-size:clamp(22px,4.4vmin,46px);font-weight:800;margin-top:2vmin;letter-spacing:-.01em}
#veil p{font-size:clamp(14px,2.4vmin,22px);font-weight:600;color:var(--ink2);margin-top:1.2vmin}

/* ---------------- tile drill-down: gallery modal (local server only) ------ */
.card{transition:transform .18s ease}
.card.click{cursor:pointer}
.card.click:active{transform:scale(.975)}
.peek{
  position:absolute;right:clamp(12px,2.2vmin,24px);bottom:clamp(8px,1.6vmin,18px);
  color:var(--ink2);opacity:0;font-size:clamp(15px,2.4vmin,24px);font-weight:900;
  line-height:1;transition:opacity .4s ease;pointer-events:none;
}
.card.click .peek{opacity:.45}
#modal{
  position:absolute;inset:0;z-index:60;display:none;place-items:center;
  background:rgba(8,12,8,.45);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding:calc(clamp(10px,2vmin,26px) + env(safe-area-inset-top))
          calc(clamp(10px,2vmin,26px) + env(safe-area-inset-right))
          calc(clamp(10px,2vmin,26px) + env(safe-area-inset-bottom))
          calc(clamp(10px,2vmin,26px) + env(safe-area-inset-left));
}
#modal.show{display:grid}
#mbox{
  width:min(100%,780px);height:100%;max-height:840px;
  background:var(--card);border-radius:24px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  animation:mpop .28s ease;
}
@keyframes mpop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
#mhead{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;flex:none}
#mhead .iconbox{width:44px;height:44px;border-radius:12px}
#mtitles{min-width:0;flex:1}
#mtitle{
  font-size:clamp(18px,2.9vmin,26px);font-weight:800;letter-spacing:-.01em;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#msub{font-size:clamp(12px,1.9vmin,15px);font-weight:600;color:var(--ink2);margin-top:2px}
#mclose{
  flex:none;width:38px;height:38px;border-radius:50%;border:none;
  background:var(--iconbg);color:var(--ink);font-size:18px;font-weight:900;cursor:pointer;
}
#mslide{
  flex:1;min-height:0;overflow-y:auto;padding:6px 18px 14px;
  -webkit-user-select:text;user-select:text;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
#mfoot{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px 14px;border-top:1px solid var(--iconbg);
}
.mnav{
  width:46px;height:46px;border-radius:50%;border:none;
  background:var(--iconbg);color:var(--ink);font-size:22px;font-weight:900;cursor:pointer;
}
.mnav:disabled{opacity:.22;cursor:default}
#mcount{font-weight:700;color:var(--ink2);font-size:clamp(13px,2vmin,16px)}
.mailhead{
  display:grid;grid-template-columns:auto 1fr;gap:4px 12px;
  font-size:clamp(13px,2vmin,16px);font-weight:600;padding:8px 0 12px;
}
.mailhead b{color:var(--ink2);font-weight:700}
.mailhead span{overflow-wrap:anywhere}
.mailsubj{font-size:clamp(15px,2.5vmin,20px);font-weight:800;margin:0 0 10px}
.mailbody{
  white-space:pre-wrap;font-size:clamp(13px,2.05vmin,16px);line-height:1.5;font-weight:500;
  border-top:1px solid var(--iconbg);padding-top:12px;font-family:inherit;
}
.mnote{color:var(--ink2);font-style:italic;font-weight:600;font-size:clamp(12px,1.9vmin,15px);margin-top:10px}
.mtag{
  display:inline-flex;align-items:center;background:var(--iconbg);border-radius:999px;
  padding:.32em .8em;font-size:clamp(12px,1.9vmin,15px);font-weight:700;margin:0 6px 6px 0;
}
.mtag.bad{background:var(--bad);color:#fff}
.mtag.muted{color:var(--ink2);font-style:italic}
.mconf{
  background:var(--iconbg);border-radius:14px;padding:12px 14px;
  font-size:clamp(13px,2.05vmin,16px);font-weight:600;line-height:1.45;margin-top:8px;
}
.mshot{width:100%;border-radius:14px;box-shadow:var(--shadow);margin-top:12px;display:block}
.mlist{list-style:none;margin-top:6px}
.mlist li{padding:9px 0;border-bottom:1px solid var(--iconbg);font-weight:600;font-size:clamp(13px,2.1vmin,17px)}
.mlist li:last-child{border-bottom:none}
#mslide a{color:var(--work)}
.mbtn{
  display:inline-block;background:var(--work);color:#fff !important;border-radius:999px;
  padding:.5em 1.05em;font-weight:800;text-decoration:none;
  font-size:clamp(13px,2vmin,16px);margin:10px 8px 0 0;
}
.mframe{
  width:100%;height:min(56vh,520px);border:none;border-radius:14px;
  box-shadow:var(--shadow);margin-top:12px;background:#fff;
}

/* ---------------- gate lock screen (public encrypted mirror only) --------- */
#lock{
  position:absolute;inset:0;z-index:70;
  background:var(--veilbg);
  display:none;place-items:center;text-align:center;
  padding:6vmin;
}
#lock.show{display:grid}
#lockcard{
  width:min(92vw,420px);
  background:var(--card);border-radius:24px;box-shadow:var(--shadow);
  padding:26px 22px;display:flex;flex-direction:column;gap:14px;
}
#lockcard.shake{animation:lockshake .45s ease}
@keyframes lockshake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
  60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
}
#lockheart{font-size:52px;line-height:1;animation:breathe 2s ease-in-out infinite}
#locktitle{font-size:21px;font-weight:800;letter-spacing:-.01em}
#locksub{font-size:14px;font-weight:600;color:var(--ink2);line-height:1.4;margin-top:-6px}
#lockpw{
  width:100%;border:2px solid var(--iconbg);border-radius:14px;
  background:var(--tint-none);color:var(--ink);
  padding:12px 14px;font-size:16px;font-weight:600;font-family:inherit;
  outline:none;-webkit-user-select:text;user-select:text;
}
#lockpw:focus{border-color:var(--work)}
#lockpad{
  border:none;border-radius:18px;background:var(--iconbg);color:var(--ink);
  padding:18px 14px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#lockpad:active{transform:scale(.97)}
#lockpad .padheart{font-size:34px;line-height:1;transition:transform .12s ease}
#lockpad.thump .padheart{transform:scale(1.35)}
#lockpad .padlabel{font-size:13px;font-weight:700;color:var(--ink2)}
#lockdots{
  min-height:22px;font-size:17px;font-weight:900;letter-spacing:.18em;
  color:var(--work);
}
#lockdots .faint{opacity:.4}
#lockrow{display:flex;gap:10px;align-items:center}
#lockgo{
  flex:1;border:none;border-radius:999px;background:var(--ok);color:#fff;
  padding:13px 0;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;
}
#lockgo:disabled{opacity:.55;cursor:default}
#lockclear{
  flex:none;border:none;background:none;color:var(--ink2);
  font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
  text-decoration:underline;
}
#lockerr{min-height:18px;font-size:13px;font-weight:700;color:var(--bad)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body data-overall="none">
<div id="bg" aria-hidden="true"><i id="blob1"></i><i id="blob2"></i></div>
<main id="app">
  <header id="verdict">
    <div id="vcircle" class="v-none"><span id="vglyph">…</span></div>
    <div id="vwords">Checking…</div>
  </header>
  <div id="ekgwrap" aria-hidden="true"><canvas id="ekg"></canvas></div>
  <section id="cards"></section>
  <footer id="strip">
    <span id="doctor">🤖 Robot doctor hasn’t checked yet today</span>
    <span id="blogline" hidden></span>
    <span id="updated"><span id="upddot" aria-hidden="true"><span id="updping"></span></span><span id="updtext">Waiting for the first update…</span> <span style="opacity:.45;font-size:.85em">v2026-08-11.3</span></span>
  </footer>
</main>
<div id="veil" aria-hidden="true">
  <div>
    <div class="zzz">😴</div>
    <h2>Can’t reach the Mac right now</h2>
    <p id="veilsub">Waiting for the first update…</p>

var CHIP = {

var TINT = {
  light:{ok:"#eaf4ea", degraded:"#f7f0df", down:"#f9ecec", none:"#eff1ef"},
  dark: {ok:"#121a12", degraded:"#1c1710", down:"#1f1214", none:"#161816"}
};

/* ------------------------------------------------ build the card skeletons once */
var cardEls = {};
var DOTC = {ok:"var(--ok)", in_progress:"var(--work)", pending_today:"var(--wait)", issue:"var(--bad)"};
(function build(){
  var wrap = document.getElementById("cards");
  ORDER.forEach(function(id, i){
    var card = document.createElement("article");

    var dot = document.createElement("span"); dot.className = "livedot";
    dot.style.animationDelay = (-(i * 0.45)).toFixed(2) + "s"; /* phase-offset shimmer */
    var peek = document.createElement("span"); peek.className = "peek";
    peek.textContent = "›"; peek.setAttribute("aria-hidden","true");
    card.appendChild(top); card.appendChild(chip); card.appendChild(say);
    card.appendChild(dot); card.appendChild(peek);
    wrap.appendChild(card);
    cardEls[id] = {card:card, chip:chip, say:say, dot:dot};
  });
})();

/* ------------------------------------------------ friendly time, never ISO */
function parseISO(s){ if(!s) return null; var d = new Date(s); return isNaN(d) ? null : d; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function weekdayName(d){ return d.toLocaleDateString(undefined,{weekday:"long"}); }
function monthDay(d){ return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function clockStr(d){
  var h = d.getHours()%12 || 12, m = d.getMinutes();
  return m ? h + ":" + String(m).padStart(2,"0") : String(h);
}
function friendlyDay(d){
  var now = new Date();
  if(sameDay(d,now)) return "today";
  var y = new Date(now); y.setDate(y.getDate()-1);
  if(sameDay(d,y)) return "yesterday";
  if(now - d < 6.5*86400000 && now > d) return weekdayName(d);
  return monthDay(d);
}
function relTime(d){
  if(!d) return "a little while ago";
  var s = (Date.now() - d.getTime())/1000; if(s < 0) s = 0;
  if(s < 90) return "just now";
  var m = Math.round(s/60);
  if(m < 60) return m === 1 ? "a minute ago" : m + " minutes ago";
  var h = Math.round(m/60);
  if(h < 24) return h === 1 ? "an hour ago" : h + " hours ago";
  var day = friendlyDay(d);
  return day === "yesterday" ? "yesterday" : "on " + day;
}
function plural(n, one, many){ return n === 1 ? one : many; }

/* ------------------------------------------------ plain-English sentences */
function pendingSentence(a){
  var d = parseISO(a && a.next_run_at);
  if(!d) return "Runs later today";
  var now = new Date(), c = clockStr(d);
  if(sameDay(d, now)){
    var h = d.getHours();
    var tod = h < 12 ? "this morning" : (h < 17 ? "this afternoon" : "tonight");
    return "Runs " + tod + " at " + c;
  }
  var tom = new Date(now); tom.setDate(tom.getDate()+1);
  if(sameDay(d, tom)) return "Runs tomorrow at " + c;
  return "Runs " + weekdayName(d) + " at " + c;
}
function doneFallback(a){
  var d = parseISO(a && a.last_run && a.last_run.at);
  return d ? "Finished " + relTime(d) + " ✓" : "Hasn’t run yet";
}
function sentenceFor(a, totals, doctor){
  if(!a) return "No news yet";
  var st = a.state;
  if(st === "in_progress") return "Working on it right now…";
  if(st === "pending_today") return pendingSentence(a);
  if(st === "issue"){
    /* the doctor tile explains itself: lead with its first issue string */
    if(a.id === "doctor" && a.issues && a.issues.length) return String(a.issues[0]);
    var needs = doctor && doctor.needs_human && doctor.needs_human.length;
    return needs ? "Something went wrong — it needs you"
                 : "Something went wrong — it will try again tomorrow";
  }
  /* ok (and anything unexpected) → say what it accomplished */
  var t = totals || {};
  switch(a.id){
    case "scholarship-daily":
      if(typeof t.scholarships_submitted_cycle === "number")
        return "Applied to " + t.scholarships_submitted_cycle + " " +
               plural(t.scholarships_submitted_cycle,"scholarship","scholarships") + " so far";
      return doneFallback(a);
    case "parent-weekly":
      var sent = parseISO(t.parent_last_sent);
      return sent ? "Sent " + friendlyDay(sent) + " ✓" : "Sent this week ✓";
    case "prof-outreach":
      if(typeof t.prof_emails_week === "number")
        return "Sent " + t.prof_emails_week + " " + plural(t.prof_emails_week,"email","emails") + " this week";
      return doneFallback(a);
    case "ai-outreach":
      if(typeof t.ai_emails_week === "number")
        return "Sent " + t.ai_emails_week + " " + plural(t.ai_emails_week,"email","emails") + " this week";
      return doneFallback(a);
    case "blog":
      return t.blog_latest ? "New post is up!" : doneFallback(a);
    case "doctor":
      /* healthy: read the pinned metrics — Jobs healthy "N/M" + Fixes (7d) */
      var dm = {};
      (a.metrics || []).forEach(function(x){ dm[x.label] = x.value; });
      var jobsVal = dm["Jobs healthy"];
      if(jobsVal){
        var healthyN = String(jobsVal).split("/")[0];
        var fixesN = parseInt(dm["Fixes (7d)"], 10); if(isNaN(fixesN)) fixesN = 0;
        return "All " + healthyN + " jobs healthy — " + fixesN + " " +
               plural(fixesN,"fix","fixes") + " this week";
      }
      return doneFallback(a);
    case "startup-outreach":
      /* say line straight from the snapshot metrics: ranked + drafts */
      var m = {};
      (a.metrics || []).forEach(function(x){ m[x.label] = x.value; });
      if(m["Companies ranked"])
        return m["Companies ranked"] + " startups ranked · " +
               (m["Drafts prepared"] || 0) + " drafts ready";
      return doneFallback(a);
    default:
      return doneFallback(a);
  }
}

/* ------------------------------------------------ render */
var data = null, lastGen = null, prevStates = {}, firstRender = true;
var themeMeta = document.querySelector('meta[name="theme-color"]');
var darkMQ = matchMedia("(prefers-color-scheme: dark)");

function setTheme(state){
  var mode = darkMQ.matches ? "dark" : "light";
  themeMeta.setAttribute("content", TINT[mode][state] || TINT[mode].none);
}
function render(){
  if(!data) return;
  var overall = data.overall === "ok" || data.overall === "down" ? data.overall
              : (data.overall ? "degraded" : "none");
  document.body.setAttribute("data-overall", overall);
  setTheme(overall);

  var v = VERDICT[overall] || VERDICT.none;
  document.getElementById("vglyph").textContent = v.glyph;
  document.getElementById("vwords").textContent = v.words;
  document.getElementById("vcircle").style.background = VCOLOR[overall] || VCOLOR.none;

  var vd = document.getElementById("verdict");
  if(!vd.classList.contains("click")){
    vd.classList.add("click");
    vd.setAttribute("role","button");
    vd.setAttribute("tabindex","0");
  }
  vd.setAttribute("aria-label", v.words + " — tap for details");
  vd.title = "Tap to see why";
  if(document.getElementById("why").classList.contains("show")) renderWhy();

  var byId = {};
  (data.automations || []).forEach(function(a){ if(a && a.id) byId[a.id] = a; });

  ORDER.forEach(function(id){
    var a = byId[id], el = cardEls[id];
    var st = a && CHIP[a.state] ? a.state : "pending_today";
    var chip = CHIP[st];
    el.chip.className = "chip " + chip.cls;
    el.chip.innerHTML = chip.html;
    el.dot.style.setProperty("--dotc", DOTC[st] || DOTC.pending_today);
    el.say.textContent = sentenceFor(a, data.totals, data.doctor);
    if(!firstRender && prevStates[id] && prevStates[id] !== st && st === "ok"){
      el.card.classList.remove("pop");
      void el.card.offsetWidth; /* restart animation */
      el.card.classList.add("pop");
    }
    prevStates[id] = st;
  });

  /* bottom strip */
  var doc = data.doctor, docLine;
  if(!doc || !doc.last_run_at){
    docLine = "🤖 Robot doctor hasn’t checked yet today";
  } else if(doc.needs_human && doc.needs_human.length){
    var n = doc.needs_human.length;
    docLine = "🤖 " + n + " " + plural(n,"thing needs","things need") + " you ❗";
  } else if(doc.actions && doc.actions.length){
    var f = doc.actions.length;
    docLine = "🤖 Robot doctor fixed " + f + " " + plural(f,"thing","things") + " today";
  } else {
    docLine = "🤖 Robot doctor: nothing to fix today";
  }
  document.getElementById("doctor").textContent = docLine;

  var blogEl = document.getElementById("blogline");
  var latest = data.totals && data.totals.blog_latest;
  if(latest && latest.title){
    blogEl.hidden = false;
    blogEl.textContent = "Newest post: “" + latest.title + "”";
  } else {
    blogEl.hidden = true;
    blogEl.textContent = "";
  }

  document.getElementById("updtext").textContent = "Updated " + relTime(lastGen);
  firstRender = false;

  /* keep the heartbeat line in the current status color */
  refreshEkgColor();
  if(motionMQ.matches) drawEkg(0); /* reduced motion: one static trace frame */
}

/* ------------------------------------------------ "why this status" popup */
var whyEl = document.getElementById("why");
var whyList = document.getElementById("whylist");
var whyTitle = document.getElementById("whytitle");
var verdictEl = document.getElementById("verdict");

/* Everything that explains the current verdict, worst first. */
function attentionItems(){
  var items = [];
  if(!data) return items;
  (data.automations || []).forEach(function(a){
    if(!a || a.state !== "issue") return;
    var lines = (a.issues || []).map(String);
    if(!lines.length) lines = ["Something went wrong on the last run"];
    items.push({icon:ICONS[a.id] || "", name:NICE[a.id] || a.id, lines:lines});
  });
  var doc = data.doctor;
  if(doc && doc.needs_human && doc.needs_human.length){
    items.push({icon:"", emoji:"🤖", name:"Robot doctor says you're needed",
                lines:doc.needs_human.map(String)});
  }
  return items;
}
function renderWhy(){
  var items = attentionItems();
  whyList.textContent = "";
  if(!items.length){
    var overall = data && (data.overall === "ok" || data.overall === "down"
                  ? data.overall : (data.overall ? "degraded" : "none"));
    whyTitle.textContent = "Status check";
    var okd = document.createElement("div");
    okd.className = "whyok";
    okd.innerHTML = overall === "ok"
      ? '<span class="bigok">✓</span>Everything ran the way it should.<br>Nothing needs you right now.'
      : '<span class="bigok">…</span>Still gathering details — check back in a minute.';
    whyList.appendChild(okd);
    return;
  }
  whyTitle.textContent = items.length === 1 ? "1 thing needs attention"
                       : items.length + " things need attention";
  items.forEach(function(it){
    var box = document.createElement("div"); box.className = "whyitem";
    var top = document.createElement("div"); top.className = "whotop";
    if(it.emoji){
      var em = document.createElement("span"); em.textContent = it.emoji;
      top.appendChild(em);
    } else if(it.icon){
      var ic = document.createElement("span"); ic.innerHTML = it.icon;
      ic.style.display = "inline-flex"; top.appendChild(ic);
    }
    var nm = document.createElement("span"); nm.textContent = it.name;
    top.appendChild(nm);
    var badge = document.createElement("span"); badge.className = "wbadge";
    badge.textContent = "Needs Help";
    top.appendChild(badge);
    var ul = document.createElement("ul");
    it.lines.forEach(function(line){
      var li = document.createElement("li"); li.textContent = line;
      ul.appendChild(li);
    });
    box.appendChild(top); box.appendChild(ul);
    whyList.appendChild(box);
  });
}
function openWhy(){
  if(!data) return;
  renderWhy();
  whyEl.classList.add("show");
  whyEl.setAttribute("aria-hidden","false");
}
function closeWhy(){
  whyEl.classList.remove("show");
  whyEl.setAttribute("aria-hidden","true");
}
verdictEl.addEventListener("click", openWhy);
verdictEl.addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openWhy(); }
});
document.getElementById("whyclose").addEventListener("click", closeWhy);
whyEl.addEventListener("click", function(e){ if(e.target === whyEl) closeWhy(); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && whyEl.classList.contains("show")) closeWhy();
});

/* ------------------------------------------------ polling + offline veil */
var fails = 0;
var staleCount = 0;
var veil = document.getElementById("veil");

function showStaleBanner(when){
  var b = document.getElementById("stalebanner");
  if(!b){
    b = document.createElement("div");
    b.id = "stalebanner";
    b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:900;text-align:center;" +
      "padding:10px 16px;font-weight:700;font-size:15px;background:#c98500;color:#fff;cursor:pointer";
    b.onclick = function(){ window.location.replace(window.location.pathname + "?r=" + Date.now()); };
    document.body.appendChild(b);
  }
  b.textContent = "⚠️ Showing data from " + relTime(when) + " — the Mac may be asleep or offline. Tap to retry.";
  b.style.display = "block";
}
function hideStaleBanner(){
  var b = document.getElementById("stalebanner");
  if(b) b.style.display = "none";
}

function showVeil(){
  var sub = lastGen ? "Showing the last update from " + relTime(lastGen)
                    : "Waiting for the first update…";
  document.getElementById("veilsub").textContent = sub;
  veil.classList.add("show");
  veil.setAttribute("aria-hidden","false");
}
function hideVeil(){
  veil.classList.remove("show");
  veil.setAttribute("aria-hidden","true");
}
function poll(){
  /* ?t= defeats CDN edge caching (GitHub Pages ignores request no-store) */
  fetch("./status.json?t=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(unwrapGate) /* public mirror: AES envelope -> lock screen/decrypt */
    .then(function(json){
      fails = 0;
      data = json || {};
      lastGen = parseISO(data.generated_at) || new Date();
      /* Stale-tab self-rescue: if our freshest fetch is >90 min old, some
         cache layer is lying (or the Mac is off). Reload ONCE with a
         cache-busting URL; if still stale afterwards, show the honest
         banner instead of looping. */
      var ageMin = (Date.now() - lastGen.getTime()) / 60000;
      if(ageMin > 90){
        staleCount++;
        var rescued = false;
        try { rescued = sessionStorage.getItem("staleRescued") === "1"; } catch(e){}
        if(staleCount >= 2 && !rescued){
          try { sessionStorage.setItem("staleRescued", "1"); } catch(e){}
          window.location.replace(window.location.pathname + "?r=" + Date.now());
          return;
        }

      } else {
        staleCount = 0;
        try { sessionStorage.removeItem("staleRescued"); } catch(e){}
        hideStaleBanner();
      }
      hideVeil();
      render();
      /* refresh blip: single radar-ping on the “Updated” dot */
      if(!motionMQ.matches){
        var ping = document.getElementById("updping");
        ping.classList.remove("go");
        void ping.offsetWidth; /* restart the one-shot animation */
        ping.classList.add("go");
      }
    })
    .catch(function(err){
      if(err && err.gateLocked) return; /* lock screen is up, not an outage */
      fails++;
      if(fails >= 2) showVeil();
    });
}

/* ------------------------------------------------ passphrase gate
   On the public mirror, status.json and details.json are AES envelopes
   (see gatecrypt.py): PBKDF2 of "password|knock" -> AES-256-CTR + HMAC.
   The knock is the quirky part — a secret heartbeat tapped on the pad;
   tap-group sizes (e.g. lub-dub … lub-dub = "2-2") are mixed into the key
   derivation, so the wrong rhythm mathematically cannot decrypt. The local
   server sends plaintext, so at home the gate never appears. */
var lockEl = document.getElementById("lock");
var lockCard = document.getElementById("lockcard");
var lockPw = document.getElementById("lockpw");
var lockPad = document.getElementById("lockpad");
var lockDots = document.getElementById("lockdots");
var lockGo = document.getElementById("lockgo");
var lockClear = document.getElementById("lockclear");
var lockErr = document.getElementById("lockerr");
var gateKeys = null;      /* {aes, mac} CryptoKeys once unlocked */
var gateEnv = null;       /* latest envelope seen (unlock attempts run on it) */
var gateBusy = false;
var taps = [];
var KNOCK_GAP_MS = 650;   /* a pause longer than this starts a new tap group */

function isEnvelope(o){ return !!(o && o.v === 1 && o.ct && o.kdf); }
function b64bytes(s){
  var bin = atob(s), a = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
function bytesB64(buf){
  var a = new Uint8Array(buf), s = "";
  for(var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
  return btoa(s);
}
function subtleOK(){ return !!(window.crypto && crypto.subtle); }
function importGateKeys(bits){ /* 64 raw bytes -> AES-CTR + HMAC verify keys */
  return Promise.all([
    crypto.subtle.importKey("raw", bits.slice(0, 32), {name:"AES-CTR"}, false, ["decrypt"]),
    crypto.subtle.importKey("raw", bits.slice(32), {name:"HMAC", hash:"SHA-256"}, false, ["verify"])
  ]).then(function(ks){ return {aes:ks[0], mac:ks[1]}; });
}
function deriveGateBits(passInput, env){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(passInput),
                                 "PBKDF2", false, ["deriveBits"])
    .then(function(km){
      return crypto.subtle.deriveBits(
        {name:"PBKDF2", hash:"SHA-256", salt:b64bytes(env.kdf.salt),
         iterations:env.kdf.iter}, km, 512);
    });
}
function decryptEnvelope(env, keys){ /* verify HMAC(iv||ct), then AES-CTR */
  var iv = b64bytes(env.iv), ct = b64bytes(env.ct), mac = b64bytes(env.mac);
  var signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  return crypto.subtle.verify("HMAC", keys.mac, mac, signed)
    .then(function(ok){
      if(!ok) throw new Error("bad key");
      return crypto.subtle.decrypt({name:"AES-CTR", counter:iv, length:128},
                                   keys.aes, ct);
    })
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
}
function forgetGate(){
  gateKeys = null;
  try { localStorage.removeItem("gateBits"); localStorage.removeItem("gateSalt"); } catch(e){}
}
function unwrapGate(json){
  if(!isEnvelope(json)) return Promise.resolve(json);  /* local plaintext */
  gateEnv = json;
  var locked = {gateLocked: true};
  if(!subtleOK()){
    showLock("Unlocking needs a modern browser over https.");
    return Promise.reject(locked);
  }
  if(gateKeys){
    return decryptEnvelope(json, gateKeys).catch(function(){
      forgetGate(); showLock(); throw locked;   /* password changed upstream */
    });
  }
  var bits = null, salt = null;   /* remembered from a prior unlock here */
  try { bits = localStorage.getItem("gateBits"); salt = localStorage.getItem("gateSalt"); } catch(e){}
  if(bits && salt === json.kdf.salt){
    return importGateKeys(b64bytes(bits).buffer)
      .then(function(keys){
        return decryptEnvelope(json, keys).then(function(obj){
          gateKeys = keys; hideLock(); return obj;
        });
      })
      .catch(function(){ forgetGate(); showLock(); throw locked; });
  }
  showLock();
  return Promise.reject(locked);
}
function knockCode(){ /* taps -> group sizes, e.g. lub-dub…lub-dub -> "2-2" */
  if(!taps.length) return "";
  var groups = [1];
  for(var i = 1; i < taps.length; i++){
    if(taps[i] - taps[i-1] > KNOCK_GAP_MS) groups.push(1);
    else groups[groups.length - 1]++;
  }
  return groups.join("-");
}
function drawTaps(){
  if(!taps.length){
    lockDots.innerHTML = '<span class="faint">···</span>';
    return;
  }
  var out = "";
  for(var i = 0; i < taps.length; i++){
    if(i && taps[i] - taps[i-1] > KNOCK_GAP_MS) out += "  ";
    out += "●";
  }
  lockDots.textContent = out;
}
function showLock(msg){
  lockEl.classList.add("show");
  lockEl.setAttribute("aria-hidden", "false");
  if(msg) lockErr.textContent = msg;
}
function hideLock(){
  lockEl.classList.remove("show");
  lockEl.setAttribute("aria-hidden", "true");
  lockErr.textContent = "";
}
function tryUnlock(pw, knock){
  if(!gateEnv || gateBusy || !subtleOK()) return Promise.reject(new Error("not ready"));
  gateBusy = true;
  lockGo.disabled = true; lockGo.textContent = "Checking…";
  function done(){ gateBusy = false; lockGo.disabled = false; lockGo.textContent = "Unlock"; }
  return deriveGateBits(pw + "|" + knock, gateEnv)
    .then(function(bits){
      return importGateKeys(bits).then(function(keys){
        return decryptEnvelope(gateEnv, keys).then(function(){
          gateKeys = keys;
          try {
            localStorage.setItem("gateBits", bytesB64(bits));
            localStorage.setItem("gateSalt", gateEnv.kdf.salt);
          } catch(e){}
        });
      });
    })
    .then(function(){
      done(); hideLock();
      taps = []; drawTaps(); lockPw.value = "";
      poll(); fetchDetails();
    })
    .catch(function(err){
      done();
      lockErr.textContent = "That’s not the right beat. Try again.";
      taps = []; drawTaps();
      lockCard.classList.remove("shake"); void lockCard.offsetWidth;
      lockCard.classList.add("shake");
      throw err;
    });
}
lockPad.addEventListener("click", function(){
  if(taps.length >= 12) return;
  taps.push(performance.now());
  drawTaps();
  lockErr.textContent = "";
  lockPad.classList.remove("thump"); void lockPad.offsetWidth;
  lockPad.classList.add("thump");
});
lockClear.addEventListener("click", function(){ taps = []; drawTaps(); });
lockGo.addEventListener("click", function(){
  tryUnlock(lockPw.value, knockCode()).catch(function(){});
});
lockPw.addEventListener("keydown", function(e){
  if(e.key === "Enter") tryUnlock(lockPw.value, knockCode()).catch(function(){});
});
/* test hook — identical to typing the password and tapping the beat */
window.__gateTry = function(pw, knock){ return tryUnlock(pw, knock); };

function renderSlide(){

  if(!sec || !sec.items || !sec.items.length){ closeModal(); return; }
  if(mState.idx >= sec.items.length) mState.idx = sec.items.length - 1;
  if(mState.idx < 0) mState.idx = 0;
  mtitle.textContent = NICE[mState.id] || mState.id;
  msub.textContent = SUBTITLE[mState.id] || "";

  mslide.appendChild((SLIDE[sec.kind] || emailSlide)(sec.items[mState.idx]));
  mslide.scrollTop = 0;
  mcount.textContent = (mState.idx + 1) + " of " + sec.items.length;
  mprev.disabled = mState.idx <= 0;
  mnext.disabled = mState.idx >= sec.items.length - 1;
}
function openModal(id){
  var sec = DETAILS && DETAILS.sections && DETAILS.sections[id];
  if(!sec || !sec.items || !sec.items.length) return;
  mState.id = id; mState.idx = 0;
  modalEl.classList.add("show");
  modalEl.setAttribute("aria-hidden","false");
  renderSlide();
}
function closeModal(){
  modalEl.classList.remove("show");

  mState.id = null;
}
function stepSlide(d){
  if(mState.id == null) return;

  renderSlide();
}
document.getElementById("mclose").addEventListener("click", closeModal);

mnext.addEventListener("click", function(){ stepSlide(1); });
modalEl.addEventListener("click", function(e){ if(e.target === modalEl) closeModal(); });
document.addEventListener("keydown", function(e){
  if(mState.id == null) return;
  if(e.key === "Escape") closeModal();
  else if(e.key === "ArrowLeft") stepSlide(-1);
  else if(e.key === "ArrowRight") stepSlide(1);
});
/* swipe left/right on the slide flips through the gallery */
var touchX = null, touchY = null;
mslide.addEventListener("touchstart", function(e){
  if(e.touches.length === 1){ touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }
}, {passive:true});
mslide.addEventListener("touchend", function(e){
  if(touchX == null || !e.changedTouches.length) return;
  var dx = e.changedTouches[0].clientX - touchX;
  var dy = e.changedTouches[0].clientY - touchY;
  touchX = touchY = null;
  if(Math.abs(dx) > 55 && Math.abs(dy) < 45) stepSlide(dx < 0 ? 1 : -1);
}, {passive:true});

function markClickable(){
  ORDER.forEach(function(id){
    var sec = DETAILS && DETAILS.sections && DETAILS.sections[id];
    var elc = cardEls[id];

    elc.card.addEventListener("click", function(){ openModal(id); });
    elc.card.addEventListener("keydown", function(e){

    });

}
function fetchDetails(){

    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(unwrapGate) /* public mirror: AES envelope -> lock screen/decrypt */
    .then(function(j){
      if(j && j.sections){
        DETAILS = j;
        markClickable();
        if(mState.id != null) renderSlide();
      }
    })
    .catch(function(){});
}

/* ------------------------------------------------ live heartbeat line (EKG)
   The primary “it’s alive” signal: a thin scrolling trace in the overall
   status color. Steady beats when ok, irregular when degraded, slow weak
   beats with long flat stretches when down. Canvas, ~60fps-cheap, with a
   setInterval fallback for panes/tabs where rAF is throttled. */
var motionMQ = matchMedia("(prefers-reduced-motion: reduce)");
var ekgCanvas = document.getElementById("ekg");
var ekgCtx = ekgCanvas.getContext("2d");
var ekgColor = "#68716b";
var ekgW = 0, ekgH = 0;
var EKG_VAR = {ok:"--ok", degraded:"--warn", down:"--bad", none:"--wait"};
/* heart rhythm per overall state: repeating beat gaps (seconds) + amplitude */
var RHYTHM = {
  ok:       {gaps:[2.0],                    amp:1.0},
  degraded: {gaps:[1.35, 1.05, 1.75, 1.2],  amp:0.9},
  down:     {gaps:[3.6, 5.4],               amp:0.45},
  none:     {gaps:[2.6],                    amp:0.55}
};
var PX_PER_SEC = 90;

function refreshEkgColor(){
  var overall = document.body.getAttribute("data-overall") || "none";
  var v = getComputedStyle(document.documentElement)
            .getPropertyValue(EKG_VAR[overall] || "--wait").trim();
  ekgColor = v || "#68716b";
}
/* one PQRST-ish beat, p = seconds since beat onset, returns -0.35..1 */
function beatShape(p){
  if(p < 0 || p > 0.5) return 0;
  if(p < 0.08)  return 0.15 * Math.sin(p / 0.08 * Math.PI);          /* P bump */
  if(p < 0.12)  return 0;
  if(p < 0.15)  return -0.22 * ((p - 0.12) / 0.03);                  /* Q dip */
  if(p < 0.19)  return -0.22 + 1.22 * ((p - 0.15) / 0.04);           /* R spike */
  if(p < 0.235) return 1.0 - 1.35 * ((p - 0.19) / 0.045);            /* S drop */
  if(p < 0.27)  return -0.35 + 0.35 * ((p - 0.235) / 0.035);         /* settle */
  if(p < 0.33)  return 0;
  return 0.28 * Math.sin((p - 0.33) / 0.17 * Math.PI);               /* T bump */
}
function signalAt(t, r){
  var total = 0, i;
  for(i = 0; i < r.gaps.length; i++) total += r.gaps[i];
  var tc = t % total; if(tc < 0) tc += total;
  var acc = 0;
  for(i = 0; i < r.gaps.length; i++){
    if(tc < acc + r.gaps[i]) return beatShape(tc - acc) * r.amp;
    acc += r.gaps[i];
  }
  return 0;
}
function drawEkg(tSec){
  if(!ekgW || !ekgH) return;
  var r = RHYTHM[document.body.getAttribute("data-overall")] || RHYTHM.none;
  var mid = ekgH * 0.62, amp = ekgH * 0.42;
  ekgCtx.clearRect(0, 0, ekgW, ekgH);
  ekgCtx.globalAlpha = 0.5;
  ekgCtx.strokeStyle = ekgColor;
  ekgCtx.lineWidth = 2;
  ekgCtx.lineJoin = "round";
  ekgCtx.lineCap = "round";
  ekgCtx.beginPath();
  for(var x = 0; x <= ekgW; x += 2){
    var y = mid - signalAt(tSec - (ekgW - x) / PX_PER_SEC, r) * amp;
    if(x === 0) ekgCtx.moveTo(x, y); else ekgCtx.lineTo(x, y);
  }
  ekgCtx.stroke();
  ekgCtx.globalAlpha = 1;
}
function sizeEkg(){
  var rect = ekgCanvas.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  ekgW = Math.max(1, Math.round(rect.width));
  ekgH = Math.max(1, Math.round(rect.height));
  ekgCanvas.width = Math.round(ekgW * dpr);
  ekgCanvas.height = Math.round(ekgH * dpr);
  ekgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawEkg(motionMQ.matches ? 0 : performance.now() / 1000);
}
var ekgRunning = false, lastRafTick = 0;
function ekgFrame(now){
  if(motionMQ.matches){ ekgRunning = false; return; }
  lastRafTick = now;
  drawEkg(now / 1000);
  requestAnimationFrame(ekgFrame);
}
function startEkg(){
  refreshEkgColor();
  sizeEkg();
  if(motionMQ.matches){ ekgRunning = false; drawEkg(0); return; }
  if(!ekgRunning){ ekgRunning = true; requestAnimationFrame(ekgFrame); }
}
/* fallback: hidden/throttled panes suppress rAF and ResizeObserver — keep
   the trace moving and the canvas correctly sized on a 1s timer */
setInterval(function(){
  if(Math.abs(ekgCanvas.clientWidth - ekgW) > 1 ||
     Math.abs(ekgCanvas.clientHeight - ekgH) > 1) sizeEkg();
  if(motionMQ.matches) return;
  var now = performance.now();
  if(now - lastRafTick > 700) drawEkg(now / 1000);
}, 1000);
window.addEventListener("resize", sizeEkg);
/* some panes resize without a window resize event — watch the strip itself */
if(typeof ResizeObserver === "function"){
  new ResizeObserver(sizeEkg).observe(document.getElementById("ekgwrap"));
}
motionMQ.addEventListener("change", startEkg);
startEkg();
</script>
</body>
</html>
